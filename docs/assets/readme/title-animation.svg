<svg xmlns="http://www.w3.org/2000/svg" width="650" height="68" viewBox="0 42 650 68" role="img" aria-labelledby="title desc">
  <title id="title">Fluid Simulation</title>
  <desc id="desc">Animated Fluid Simulation wordmark with a flowing cool-color gradient.</desc>

  <defs>
    <mask id="wordmark-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="650" height="120">
      <rect width="650" height="120" fill="black"/>
      <text x="325" y="78"
            fill="white"
            text-anchor="middle"
            dominant-baseline="middle"
            font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="61"
            font-weight="750"
            letter-spacing="-1.5">Fluid Simulation</text>
    </mask>

    <linearGradient id="flow" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="650" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#3157d5"/>
      <stop offset="0.18" stop-color="#6478f4"/>
      <stop offset="0.38" stop-color="#19cfe0"/>
      <stop offset="0.57" stop-color="#10aeb5"/>
      <stop offset="0.78" stop-color="#6058dc"/>
      <stop offset="1" stop-color="#3157d5"/>
    </linearGradient>

    <linearGradient id="sheen" gradientUnits="userSpaceOnUse" x1="0" y1="38" x2="0" y2="104">
      <stop offset="0" stop-color="#d9fbff" stop-opacity="0.72"/>
      <stop offset="0.3" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="0.64" stop-color="#071d58" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#020b2a" stop-opacity="0.42"/>
    </linearGradient>

  </defs>

  <g mask="url(#wordmark-mask)">
    <rect x="-650" y="25" width="1950" height="92" fill="url(#flow)">
      <animateTransform attributeName="transform" type="translate"
                        from="-650 0" to="0 0" dur="12s"
                        repeatCount="indefinite"/>
    </rect>

    <path d="M-120 78 C10 48 120 108 250 76 S490 48 650 78 S890 108 1020 76"
          fill="none" stroke="#9ffaff" stroke-opacity="0.22" stroke-width="25">
      <animateTransform attributeName="transform" type="translate"
                        from="-240 0" to="240 0" dur="10s"
                        repeatCount="indefinite"/>
    </path>

    <rect width="650" height="120" fill="url(#sheen)"/>
  </g>

  <text x="325" y="78"
        fill="none"
        stroke="#94f5ff"
        stroke-opacity="0.18"
        stroke-width="0.8"
        text-anchor="middle"
        dominant-baseline="middle"
        font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="61"
        font-weight="750"
        letter-spacing="-1.5">Fluid Simulation</text>
</svg>
